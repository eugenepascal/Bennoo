name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installation des dépendances
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium

      - name: Tests unitaires
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit.log
          echo "::notice title=Tests unitaires::$(grep -E '^# (tests|pass|fail)' unit.log | tr '\n' ' ')"

      - name: Tests des règles Firestore (émulateur)
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules.log
          echo "::notice title=Règles Firestore::$(grep -E '^# (tests|pass|fail)' rules.log | tr '\n' ' ')"

      - name: Parcours complet dans un navigateur (émulateurs + Playwright)
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
          node -e "const r=require('./test-results/e2e.json');const s=r.stats;console.log('::notice title=Parcours E2E::attendus '+s.expected+' · échoués '+s.unexpected+' · instables '+s.flaky+' · ignorés '+s.skipped)"

      - name: Résumé des échecs
        if: failure()
        run: |
          for f in unit.log rules.log e2e.log; do
            [ -f "$f" ] && grep -E "not ok|Error|expect|✘|failed" "$f" | head -15 | while IFS= read -r line; do echo "::error title=$f::${line:0:300}"; done
          done; true

      - name: Versions installées
        if: always()
        run: |
          echo "::notice title=Versions::$(npm ls --depth=0 2>/dev/null | tail -n +2 | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports
          path: |
            package-lock.json
            test-results/
            *.log
