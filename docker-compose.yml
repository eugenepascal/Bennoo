# Services locaux de développement. Aucun de ces services n'est destiné à la production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bennoo
      POSTGRES_PASSWORD: bennoo
      POSTGRES_DB: bennoo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bennoo -d bennoo"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bennoo
      MINIO_ROOT_PASSWORD: bennoo-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
